<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Claude Code Server</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            50: '#f9fafb',
                            100: '#f3f4f6',
                            200: '#e5e7eb',
                            300: '#d1d5db',
                            400: '#9ca3af',
                            500: '#6b7280',
                            600: '#4b5563',
                            700: '#374151',
                            800: '#1f2937',
                            900: '#111827',
                            950: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .scrollbar-hide { scrollbar-width: none; -ms-overflow-style: none; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-dark-950 text-gray-100 min-h-screen">
    <nav class="bg-dark-900 border-b border-dark-700 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-8">
                <a href="/" class="text-xl font-bold text-white">Claude Code Server</a>
                <div class="flex space-x-4">
                    <a href="/" class="text-gray-300 hover:text-white transition-colors">Dashboard</a>
                    <a href="/sessions" class="text-gray-300 hover:text-white transition-colors">Sessions</a>
                    <a href="/projects" class="text-gray-300 hover:text-white transition-colors">Projects</a>
                    <a href="/api-docs" class="text-gray-300 hover:text-white transition-colors">API Docs</a>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div class="text-sm text-gray-400">
                    <span class="inline-block w-2 h-2 bg-green-500 rounded-full mr-1"></span>
                    Online
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        {{template "content" .}}
    </main>

    <script>
        // Auto-refresh live sessions
        document.addEventListener('htmx:afterRequest', function(evt) {
            if (evt.detail.xhr.status === 200 && evt.detail.target.hasAttribute('hx-trigger')) {
                setTimeout(function() {
                    htmx.trigger(evt.detail.target, 'refresh');
                }, 2000);
            }
        });

        // Handle server-sent events for live logs
        function connectEventSource(url, target) {
            const eventSource = new EventSource(url);
            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                const logElement = document.createElement('div');
                logElement.className = 'text-sm font-mono border-l-2 border-blue-500 pl-2 mb-1';
                logElement.innerHTML = `<span class="text-gray-400">[${data.log_type}]</span> ${data.content}`;
                target.appendChild(logElement);
                target.scrollTop = target.scrollHeight;
            };
            return eventSource;
        }
    </script>
</body>
</html>
