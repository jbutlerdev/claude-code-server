<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Claude Code Server</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            50: '#f9fafb',
                            100: '#f3f4f6',
                            200: '#e5e7eb',
                            300: '#d1d5db',
                            400: '#9ca3af',
                            500: '#6b7280',
                            600: '#4b5563',
                            700: '#374151',
                            800: '#1f2937',
                            900: '#111827',
                            950: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .scrollbar-hide { scrollbar-width: none; -ms-overflow-style: none; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-dark-950 text-gray-100 min-h-screen">
    <nav class="bg-dark-900 border-b border-dark-700 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-8">
                <a href="/" class="text-xl font-bold text-white">Claude Code Server</a>
                <div class="flex space-x-4">
                    <a href="/" class="text-gray-300 hover:text-white transition-colors">Dashboard</a>
                    <a href="/sessions" class="text-gray-300 hover:text-white transition-colors">Sessions</a>
                    <a href="/projects" class="text-gray-300 hover:text-white transition-colors">Projects</a>
                    <a href="/terminal" class="text-white font-medium">Terminal</a>
                    <a href="/settings" class="text-gray-300 hover:text-white transition-colors">Settings</a>
                    <a href="/api-docs" class="text-gray-300 hover:text-white transition-colors">API Docs</a>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div class="text-sm text-gray-400">
                    <span class="inline-block w-2 h-2 bg-green-500 rounded-full mr-1"></span>
                    Online
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="space-y-6">
            <div>
                <h1 class="text-3xl font-bold text-white mb-4">Terminal</h1>
                <div class="text-sm text-gray-400">
                    Use this terminal to run <code class="bg-dark-700 px-2 py-1 rounded">claude /login</code> to authenticate
                </div>
            </div>
            
            <div class="bg-dark-900 rounded-lg border border-dark-700 p-4">
                <div class="bg-black rounded p-4 terminal-container overflow-hidden">
                    <div id="terminal" class="w-full h-96 overflow-hidden"></div>
                </div>
            </div>

            <div class="bg-blue-900/20 border border-blue-700 rounded-lg p-4">
                <div class="flex items-start space-x-3">
                    <div class="flex-shrink-0">
                        <svg class="w-5 h-5 text-blue-400 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
                        </svg>
                    </div>
                    <div>
                        <h3 class="text-sm font-medium text-blue-300 mb-1">Authentication Required</h3>
                        <p class="text-sm text-blue-200/80">
                            Before you can create sessions, you need to authenticate with Claude. Run <code class="bg-blue-800/50 px-1 py-0.5 rounded text-xs">claude /login</code> in the terminal above to get started.
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // Only initialize terminal if the terminal element exists
            if (document.getElementById('terminal')) {
                // Load terminal scripts dynamically
                const terminalScript = document.createElement('script');
                terminalScript.src = 'https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js';
                terminalScript.onload = function() {
                    // Load CSS
                    const terminalCSS = document.createElement('link');
                    terminalCSS.rel = 'stylesheet';
                    terminalCSS.href = 'https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css';
                    document.head.appendChild(terminalCSS);
                    
                    // Initialize terminal
                    const terminal = new Terminal({
                        theme: {
                            background: '#000000',
                            foreground: '#ffffff',
                            cursor: '#ffffff'
                        }
                    });
                    
                    const ws = new WebSocket(`ws://${window.location.host}/ws/terminal`);
                    
                    terminal.open(document.getElementById('terminal'));
                    terminal.focus();
                    
                    terminal.onData(data => {
                        ws.send(data);
                    });
                    
                    ws.onmessage = event => {
                        terminal.write(event.data);
                    };
                    
                    ws.onclose = () => {
                        terminal.write('\r\n\r\n[Connection closed]');
                    };
                };
                document.head.appendChild(terminalScript);
            }
        </script>
        </div>
    </main>
</body>
</html>
