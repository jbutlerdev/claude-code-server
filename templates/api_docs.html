<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Claude Code Server</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            50: '#f9fafb',
                            100: '#f3f4f6',
                            200: '#e5e7eb',
                            300: '#d1d5db',
                            400: '#9ca3af',
                            500: '#6b7280',
                            600: '#4b5563',
                            700: '#374151',
                            800: '#1f2937',
                            900: '#111827',
                            950: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
    <style>
        .scrollbar-hide { scrollbar-width: none; -ms-overflow-style: none; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        /* Override Swagger UI dark theme compatibility */
        #swagger-ui {
            background: white;
            color: #333;
            min-height: 500px;
            padding: 20px;
            border-radius: 8px;
        }
        
        /* Loading indicator */
        .swagger-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            color: #666;
        }
    </style>
</head>
<body class="bg-dark-950 text-gray-100 min-h-screen">
    <nav class="bg-dark-900 border-b border-dark-700 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-8">
                <a href="/" class="text-xl font-bold text-white">Claude Code Server</a>
                <div class="flex space-x-4">
                    <a href="/" class="text-gray-300 hover:text-white transition-colors">Dashboard</a>
                    <a href="/sessions" class="text-gray-300 hover:text-white transition-colors">Sessions</a>
                    <a href="/projects" class="text-gray-300 hover:text-white transition-colors">Projects</a>
                    <a href="/terminal" class="text-gray-300 hover:text-white transition-colors">Terminal</a>
                    <a href="/settings" class="text-gray-300 hover:text-white transition-colors">Settings</a>
                    <a href="/api-docs" class="text-white font-medium">API Docs</a>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div class="text-sm text-gray-400">
                    <span class="inline-block w-2 h-2 bg-green-500 rounded-full mr-1"></span>
                    Online
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="space-y-6">
            <h1 class="text-3xl font-bold text-white">API Documentation</h1>
            
            <div class="bg-dark-900 rounded-lg border border-dark-700 p-6">
                <h2 class="text-xl font-semibold text-white mb-4">Interactive API Explorer</h2>
                <p class="text-gray-300 mb-4">
                    Use the Swagger UI below to explore and test the Claude Code Server API endpoints.
                </p>
                
                <div id="swagger-ui" class="bg-white rounded-lg">
                    <div class="swagger-loading">
                        <div class="text-center">
                            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                            <p class="mt-2">Loading API documentation...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
    <script>
    window.onload = function() {
        // First, let's check if the OpenAPI spec loads
        fetch('/api/openapi.json', {
            headers: {
                'Authorization': 'Bearer dev-key',
                'Accept': 'application/json'
            }
        })
            .then(response => {
                console.log('OpenAPI fetch response:', response.status, response.statusText);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                return response.json();
            })
            .then(spec => {
                console.log('OpenAPI spec loaded successfully:', spec);
                
                // Initialize Swagger UI with simpler configuration
                try {
                    const ui = SwaggerUIBundle({
                        spec: spec, // Use the loaded spec directly
                        dom_id: '#swagger-ui',
                        deepLinking: true,
                        presets: [
                            SwaggerUIBundle.presets.apis
                        ],
                        plugins: [
                            SwaggerUIBundle.plugins.DownloadUrl
                        ],
                        supportedSubmitMethods: ['get', 'post', 'put', 'delete', 'patch'],
                        requestInterceptor: function(request) {
                            // Add auth header for API requests
                            console.log('Intercepting request:', request.url);
                            if (!request.headers) request.headers = {};
                            request.headers['Authorization'] = 'Bearer dev-key';
                            return request;
                        },
                        responseInterceptor: function(response) {
                            console.log('API Response:', response.status, response.url);
                            return response;
                        },
                        onComplete: function() {
                            console.log('Swagger UI loaded successfully');
                        }
                    });
                    
                    console.log('Swagger UI instance created:', ui);
                } catch (error) {
                    console.error('Failed to initialize Swagger UI:', error);
                    document.getElementById('swagger-ui').innerHTML = 
                        '<div class="p-4 bg-red-100 border border-red-400 text-red-700 rounded">' +
                        '<h3 class="font-bold">Failed to initialize Swagger UI</h3>' +
                        '<p>Error: ' + error.message + '</p>' +
                        '</div>';
                }
            })
            .catch(error => {
                console.error('Failed to load OpenAPI spec:', error);
                document.getElementById('swagger-ui').innerHTML = 
                    '<div class="p-4 bg-red-100 border border-red-400 text-red-700 rounded">' +
                    '<h3 class="font-bold">Failed to load API documentation</h3>' +
                    '<p>Error: ' + error.message + '</p>' +
                    '<p>Please check the console for more details.</p>' +
                    '</div>';
            });
    };
    </script>
</body>
</html>
