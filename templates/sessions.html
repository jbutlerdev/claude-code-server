<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Claude Code Server</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            50: '#f9fafb',
                            100: '#f3f4f6',
                            200: '#e5e7eb',
                            300: '#d1d5db',
                            400: '#9ca3af',
                            500: '#6b7280',
                            600: '#4b5563',
                            700: '#374151',
                            800: '#1f2937',
                            900: '#111827',
                            950: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .scrollbar-hide { scrollbar-width: none; -ms-overflow-style: none; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-dark-950 text-gray-100 min-h-screen">
    <nav class="bg-dark-900 border-b border-dark-700 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-8">
                <a href="/" class="text-xl font-bold text-white">Claude Code Server</a>
                <div class="flex space-x-4">
                    <a href="/" class="text-gray-300 hover:text-white transition-colors">Dashboard</a>
                    <a href="/sessions" class="text-white font-medium">Sessions</a>
                    <a href="/projects" class="text-gray-300 hover:text-white transition-colors">Projects</a>
                    <a href="/terminal" class="text-gray-300 hover:text-white transition-colors">Terminal</a>
                    <a href="/settings" class="text-gray-300 hover:text-white transition-colors">Settings</a>
                    <a href="/api-docs" class="text-gray-300 hover:text-white transition-colors">API Docs</a>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div class="text-sm text-gray-400">
                    <span class="inline-block w-2 h-2 bg-green-500 rounded-full mr-1"></span>
                    Online
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="space-y-6">
            <div>
                <h1 class="text-3xl font-bold mb-4">Sessions</h1>
                <button onclick="document.getElementById('new-session-modal').classList.remove('hidden')" 
                        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors">
                    New Session
                </button>
            </div>

    <!-- Filters -->
    <div class="bg-dark-800 rounded-lg p-4 border border-dark-700">
        <form hx-get="/htmx/sessions" hx-target="#sessions-list" class="flex gap-4 items-end">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Status</label>
                <select name="status" class="bg-dark-700 border border-dark-600 text-white rounded-lg px-3 py-2">
                    <option value="">All Statuses</option>
                    <option value="starting" {{if eq .Query.Status "starting"}}selected{{end}}>Starting</option>
                    <option value="running" {{if eq .Query.Status "running"}}selected{{end}}>Running</option>
                    <option value="completed" {{if eq .Query.Status "completed"}}selected{{end}}>Completed</option>
                    <option value="failed" {{if eq .Query.Status "failed"}}selected{{end}}>Failed</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Project</label>
                <select name="project_id" class="bg-dark-700 border border-dark-600 text-white rounded-lg px-3 py-2">
                    <option value="">All Projects</option>
                    {{range .Projects}}
                    <option value="{{.ID}}" {{if eq $.Query.ProjectID .ID.String}}selected{{end}}>{{.Name}}</option>
                    {{end}}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Page Size</label>
                <select name="page_size" class="bg-dark-700 border border-dark-600 text-white rounded-lg px-3 py-2">
                    <option value="10" {{if eq .Query.PageSize 10}}selected{{end}}>10</option>
                    <option value="20" {{if eq .Query.PageSize 20}}selected{{end}}>20</option>
                    <option value="50" {{if eq .Query.PageSize 50}}selected{{end}}>50</option>
                </select>
            </div>
            <button type="submit" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg transition-colors">
                Filter
            </button>
        </form>
    </div>

    <!-- Sessions List -->
    <div id="sessions-list">
        {{template "partials/sessions_list.html" dict "Items" .Sessions.Items "ProjectMap" .ProjectMap}}
    </div>
</div>

<!-- New Session Modal -->
<div id="new-session-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-dark-800 rounded-lg p-6 w-full max-w-md border border-dark-700">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-semibold">New Session</h2>
            <button onclick="document.getElementById('new-session-modal').classList.add('hidden')" 
                    class="text-gray-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <form class="space-y-4" onsubmit="createSession(event)">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Project</label>
                <select name="project_id" required class="w-full bg-dark-700 border border-dark-600 text-white rounded-lg px-3 py-2">
                    <option value="">Select a project</option>
                    {{range .Projects}}
                    <option value="{{.ID}}">{{.Name}}</option>
                    {{end}}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Prompt</label>
                <textarea name="prompt" required rows="4" 
                         class="w-full bg-dark-700 border border-dark-600 text-white rounded-lg px-3 py-2"
                         placeholder="Enter your prompt for Claude Code..."></textarea>
            </div>
            <div class="flex gap-3">
                <button type="button" 
                        onclick="document.getElementById('new-session-modal').classList.add('hidden')"
                        class="flex-1 bg-gray-600 hover:bg-gray-700 text-white py-2 rounded-lg transition-colors">
                    Cancel
                </button>
                <button type="submit" 
                        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg transition-colors">
                    Create Session
                </button>
            </div>
        </form>
    </div>
</div>

<script>
async function createSession(event) {
    event.preventDefault();
    const form = event.target;
    const formData = new FormData(form);
    
    try {
        const response = await fetch('/api/sessions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer dev-key'
            },
            body: JSON.stringify({
                project_id: formData.get('project_id'),
                prompt: formData.get('prompt')
            })
        });
        
        if (response.ok) {
            const session = await response.json();
            document.getElementById('new-session-modal').classList.add('hidden');
            form.reset();
            htmx.trigger('#sessions-list', 'refresh');
            window.location.href = `/sessions/${session.id}`;
        } else {
            alert('Failed to create session');
        }
    } catch (error) {
        alert('Error creating session: ' + error.message);
    }
}
</script>
        </div>
    </main>
</body>
</html>
